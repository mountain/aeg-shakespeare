[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeg-shakespeare"
version = "0.0.2.dev0"
description = "A process-representation library for discovering compact presentations from histories and relations."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Shakespeare contributors"}
]
dependencies = [
  "sympy>=1.13"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: Public Domain",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "twine>=5",
]

[project.urls]
Repository = "https://github.com/mountain/aeg-shakespeare"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
