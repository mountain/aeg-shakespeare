name: Sonnet Lonely Runner Phase 9D Persistent Update

# Heavy exact persistent update. Manual-only after the center-4 calibration.
on:
  workflow_dispatch:

jobs:
  phase9d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Phase 9D exact executable check
        env:
          AEG_RUN_LR_CENTER4_PERSISTENT_UPDATE: "1"
        run: |
          python -m pytest -q -s tests/research/test_lonely_runner_center4_persistent_update.py
