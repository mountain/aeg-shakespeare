name: Sonnet Lonely Runner Refinement Placement

# Research-only Phase 8D.2 probe. The PR trigger is temporary for one auditable
# run and will be removed after the placement profile is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-refinement-placement.yml

jobs:
  placement-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Phase 8D.2 refinement-aware placement probe
        run: |
          python sonnet/lonely-runner/python/refinement_aware_huffman.py
