name: Sonnet Lonely Runner Refinement Placement

# Research-only Phase 8D.2 calibration. The PR trigger is temporary for one
# auditable executable-essay run and will be removed after the result is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-refinement-placement.yml

jobs:
  placement-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Phase 8D.2 executable mathematical essay
        env:
          AEG_RUN_LR_REFINEMENT_PLACEMENT: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_refinement_aware_huffman.py

      - name: Print Phase 8D.2 placement profile
        run: |
          python sonnet/lonely-runner/python/refinement_aware_huffman.py
