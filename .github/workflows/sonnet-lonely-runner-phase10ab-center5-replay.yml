name: Sonnet Lonely Runner Phase 10A-B Center5 Replay

# One auditable frozen-rule scaling run.  The PR trigger is temporary and is
# removed after the center4->5 result is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase10ab-center5-replay.yml

jobs:
  phase10ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 10A/B frozen center5 replay
        run: |
          python sonnet/lonely-runner/python/center5_scaling_replay.py
