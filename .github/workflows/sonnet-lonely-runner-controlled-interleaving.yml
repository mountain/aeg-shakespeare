name: Sonnet Lonely Runner Controlled Interleaving

# Research-only Phase 8E controlled-interleaving probe. The exact 28-predicate
# searches are manual-only; routine CI audits the corresponding mathematical
# essay without rerunning the expanded exact DP on every PR synchronization.
on:
  workflow_dispatch:

jobs:
  controlled-interleaving:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run controlled old/new wall interleaving probe
        run: |
          python sonnet/lonely-runner/python/controlled_interleaving.py
