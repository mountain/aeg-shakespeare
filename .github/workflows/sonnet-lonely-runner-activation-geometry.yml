name: Sonnet Lonely Runner Activation Geometry

# Research-only Phase 8E.0 probe. The PR trigger is temporary for one auditable
# run and will be removed after the activation profile is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-activation-geometry.yml

jobs:
  activation-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run clean activation geometry probe
        run: |
          python sonnet/lonely-runner/python/activation_geometry.py
