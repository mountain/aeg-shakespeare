name: Sonnet Lonely Runner Activation Geometry

# Research-only Phase 8E.0 activation-geometry probe. The exact center-2
# feasibility audit is manual-only; routine CI audits the mathematical essay
# without repeating the system/wall closure census on every PR synchronization.
on:
  workflow_dispatch:

jobs:
  activation-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run clean activation geometry probe
        run: |
          python sonnet/lonely-runner/python/activation_geometry.py
