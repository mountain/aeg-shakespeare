name: Sonnet Lonely Runner Phase 9C Minimal Completion

# Heavy exact minimum-support search. Manual-only after the center-4 calibration.
on:
  workflow_dispatch:

jobs:
  phase9c:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run Phase 9C exact executable check
        env:
          AEG_RUN_LR_CENTER4_MINIMAL_COMPLETION: "1"
        run: |
          python -m pytest -q -s tests/research/test_lonely_runner_center4_minimal_completion.py
