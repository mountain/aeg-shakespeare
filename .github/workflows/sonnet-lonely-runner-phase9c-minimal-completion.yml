name: Sonnet Lonely Runner Phase 9C Minimal Completion

# Heavy exact minimum-support search. Manual-only after the center-4 calibration.
on:
  workflow_dispatch:

jobs:
  phase9c:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 9C minimum completion search
        run: |
          python sonnet/lonely-runner/python/center4_minimal_completion.py
