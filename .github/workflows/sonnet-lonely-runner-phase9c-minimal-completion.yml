name: Sonnet Lonely Runner Phase 9C Minimal Completion

# One auditable Phase 9C run. The PR trigger is temporary and will be removed
# after the exact center-4 minimum-support profile is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase9c-minimal-completion.yml

jobs:
  phase9c:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 9C minimum completion search
        run: |
          python sonnet/lonely-runner/python/center4_minimal_completion.py
