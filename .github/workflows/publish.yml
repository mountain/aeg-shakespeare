name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/process-geometry-publish-smoke
          /tmp/process-geometry-publish-smoke/bin/python -m pip install --upgrade pip
          /tmp/process-geometry-publish-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/process-geometry-publish-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import warnings

          import process_geometry as pg
          from process_geometry.analysis.abelian import AbelianPeriodMatrix
          from process_geometry.analysis.am import AMFunctionTheory
          from process_geometry.presentation.constraints import AlgebraicConstraintSet
          from process_geometry.process.history import ProcessWord

          assert pg.__version__ == version("process-geometry")
          assert ProcessWord is not None
          assert AMFunctionTheory is not None
          assert AlgebraicConstraintSet is not None
          assert AbelianPeriodMatrix is not None

          with warnings.catch_warnings():
              warnings.simplefilter("ignore", DeprecationWarning)
              import aeg_shakespeare as legacy
              from aeg_shakespeare.process.history import ProcessWord as LegacyProcessWord

          assert legacy.process is pg.process
          assert LegacyProcessWord is ProcessWord
          print("publish wheel smoke OK:", pg.__version__)
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/process-geometry
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
