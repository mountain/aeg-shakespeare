name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/aeg-shakespeare-publish-smoke
          /tmp/aeg-shakespeare-publish-smoke/bin/python -m pip install --upgrade pip
          /tmp/aeg-shakespeare-publish-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aeg-shakespeare-publish-smoke/bin/python - <<'PY'
          import aeg_shakespeare as shakespeare
          assert shakespeare.__version__ == "0.0.1"
          assert hasattr(shakespeare, "ProcessWord")
          assert hasattr(shakespeare, "AMFunctionTheory")
          assert hasattr(shakespeare, "AlgebraicConstraintSet")
          print("publish wheel smoke OK:", shakespeare.__version__)
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aeg-shakespeare
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
