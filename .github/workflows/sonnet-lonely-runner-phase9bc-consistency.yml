name: Sonnet Lonely Runner Phase 9B-9C Consistency

# One-shot independent local full-stratum oracle. The PR trigger is temporary;
# restore manual-only after this audit resolves the 9B/9C multiplicity conflict.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase9bc-consistency.yml

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent center4 local full-stratum oracle
        run: |
          python sonnet/lonely-runner/python/center4_local_full_oracle.py
