name: Sonnet Lonely Runner Phase 11A Five-Speed Dimension

# One auditable runner-dimension scaling probe. The PR trigger is temporary and
# is removed after the exact count profile is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase11a-five-speed-dimension.yml

jobs:
  phase11a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact five-speed dimension probe
        run: |
          python sonnet/lonely-runner/python/five_speed_dimension_probe.py
