name: Sonnet Lonely Runner Clean-Separator Theory

# Phase 13 has fast abstract red teams plus heavier five-speed exact
# applications.  Run those once on Python 3.12 instead of multiplying them
# across the routine compatibility matrix.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sonnet/lonely-runner/python/clean_separator_theory.py"
      - "sonnet/lonely-runner/python/five_speed_dimension_transfer.py"
      - "sonnet/lonely-runner/python/five_speed_clean_separator_sweep.py"
      - "sonnet/lonely-runner/python/five_speed_clean_certificate.py"
      - "sonnet/lonely-runner/python/five_speed_basis_vs_full_probe.py"
      - "sonnet/lonely-runner/37-clean-separator-criterion-and-completion-obstruction.md"
      - "sonnet/lonely-runner/38-first-critical-boundary-remains-clean.md"
      - "sonnet/lonely-runner/39-second-critical-boundary-and-basis-cleanliness.md"
      - "tests/research/test_lonely_runner_clean_separator_theory.py"
      - "tests/research/test_lonely_runner_five_speed_clean_certificate.py"
      - "tests/research/test_lonely_runner_five_speed_basis_vs_full_probe.py"
      - ".github/workflows/sonnet-lonely-runner-clean-separator-theory.yml"

jobs:
  clean-separator-theory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEG_RUN_LR_CLEAN_CERTIFICATE: "1"
      AEG_RUN_LR_BASIS_VS_FULL_PROBE: "1"

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run clean-separator red teams and critical probes
        run: |
          python -m pytest -q -s \
            tests/research/test_lonely_runner_clean_separator_theory.py \
            tests/research/test_lonely_runner_five_speed_clean_certificate.py \
            tests/research/test_lonely_runner_five_speed_basis_vs_full_probe.py
