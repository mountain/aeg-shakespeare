name: Sonnet Lonely Runner Canonical Decomposition

# Phase 8A/8B rebuilds the exact center<=2 four-speed task geometry and performs
# local center-3 red-team refinement. Phase 8C additionally certifies minimum raw
# process-generated completion residuals for the six genuinely branching parents.
# This is intentionally manual-only: routine CI still parses and audits the
# mathematical essays, but does not repeat the heavy exact census on every PR
# synchronization or across the five-version Python matrix.
on:
  workflow_dispatch:

jobs:
  canonical-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Phase 8A/8B canonical-decomposition red team
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_canonical_observer_decomposition.py

      - name: Run Phase 8C minimum completion-residual calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_minimal_completion_residuals.py

      - name: Print Phase 8B/8C local refinement records
        run: |
          python sonnet/lonely-runner/python/local_contact_refinement.py
