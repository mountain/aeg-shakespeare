name: Sonnet Lonely Runner Canonical Decomposition

# Phase 8A rebuilds the exact center<=2 four-speed task geometry and performs
# local center-3 red-team refinement. It is not part of the routine five-version
# CI matrix. Besides manual dispatch, it runs on a pull request only when this
# workflow file itself changes. Ordinary source/docs commits therefore do not
# repeatedly pay the census cost, while the dedicated research run remains
# attached to an auditable PR/commit.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-canonical-decomposition.yml

jobs:
  canonical-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run corrected Phase 8A/8B canonical-decomposition red team
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_canonical_observer_decomposition.py

      - name: Print Phase 8B history-reindex witness records
        run: |
          python sonnet/lonely-runner/python/local_contact_refinement.py
