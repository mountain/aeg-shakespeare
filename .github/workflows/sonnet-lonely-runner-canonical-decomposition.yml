name: Sonnet Lonely Runner Canonical Decomposition

# Phase 8A/8B rebuilds the exact center<=2 four-speed task geometry and performs
# local center-3 red-team refinement. Phase 8C certifies minimum raw
# process-generated completion residuals, and Phase 8C.2 quotients over-refined
# raw signatures by exact task semantics. This PR trigger is temporary so the
# new research gate is attached to an auditable commit; it is restored to
# workflow_dispatch-only after the result is recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-canonical-decomposition.yml

jobs:
  canonical-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Phase 8A/8B canonical-decomposition red team
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_canonical_observer_decomposition.py

      - name: Run Phase 8C minimum completion-residual calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_minimal_completion_residuals.py

      - name: Run Phase 8C.2 residual-objectification calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_residual_objectification.py

      - name: Print Phase 8C.2 objectification records
        run: |
          python sonnet/lonely-runner/python/residual_objectification.py
