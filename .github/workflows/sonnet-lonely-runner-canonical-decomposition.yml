name: Sonnet Lonely Runner Canonical Decomposition

# Phase 8A--8C.2 establish the local decomposition/completion/objectification
# chain. Phase 8D attaches those objectified completion decoders to the frozen
# center-2 persistent Hauffman tree and separately audits historical-usage cost
# versus the 298-child conditional refinement workload. This exact research
# suite is manual-only; routine CI audits the essays without repeating the heavy
# census on every pull-request synchronization or Python version.
on:
  workflow_dispatch:

jobs:
  canonical-decomposition:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses:
          actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Phase 8A/8B canonical-decomposition red team
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_canonical_observer_decomposition.py

      - name: Run Phase 8C minimum completion-residual calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_minimal_completion_residuals.py

      - name: Run Phase 8C.2 residual-objectification calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_residual_objectification.py

      - name: Run Phase 8D persistent-DAG increment calibration
        env:
          AEG_RUN_LR_CANONICAL_DECOMPOSITION: "1"
        run: |
          python -m pytest -q tests/research/test_lonely_runner_persistent_dag_increment.py

      - name: Print Phase 8D persistent-DAG records
        run: |
          python sonnet/lonely-runner/python/persistent_dag_increment.py
