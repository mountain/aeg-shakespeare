name: Sonnet Lonely Runner Phase 10A Center5 Pressure

# One auditable frozen-rule center4->5 pressure run. PR trigger is temporary.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase10a-center5-pressure.yml

jobs:
  phase10a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 10A center5 pressure probe
        run: |
          python sonnet/lonely-runner/python/center5_pressure.py
