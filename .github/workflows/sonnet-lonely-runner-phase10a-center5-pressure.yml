name: Sonnet Lonely Runner Phase 10A Center5 Pressure

# Heavy frozen-rule scaling probe. Manual-only after the one-shot center-5 run.
on:
  workflow_dispatch:

jobs:
  phase10a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 10A center5 pressure probe
        run: |
          python sonnet/lonely-runner/python/center5_pressure.py
