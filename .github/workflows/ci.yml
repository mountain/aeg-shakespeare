name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Run public quickstarts
        run: |
          python examples/quickstart.py
          python examples/constraint_quickstart.py
          python examples/grammar_quickstart.py
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify built wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/process-geometry-release-smoke
          /tmp/process-geometry-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/process-geometry-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/process-geometry-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import aeg_shakespeare as pg
          from aeg_shakespeare.analysis.abelian import AbelianPeriodMatrix
          from aeg_shakespeare.analysis.am import AMFunctionTheory
          from aeg_shakespeare.presentation.constraints import AlgebraicConstraintSet
          from aeg_shakespeare.presentation.morphism import PresentationMorphism
          from aeg_shakespeare.process.history import ProcessWord

          assert pg.__version__ == version("process-geometry")
          assert ProcessWord is not None
          assert AMFunctionTheory is not None
          assert AlgebraicConstraintSet is not None
          assert PresentationMorphism is not None
          assert AbelianPeriodMatrix is not None
          print("wheel smoke OK:", pg.__version__)
          PY
