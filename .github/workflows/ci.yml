name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Cover intermediate Python versions and exhaustive research certificates
    # without multiplying every pull-request run by five.
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-test-and-build:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: full-test-and-build (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test full suite
        run: python -m pytest -q --durations=25
      - name: Run public quickstarts
        run: |
          python examples/quickstart.py
          python examples/constraint_quickstart.py
          python examples/grammar_quickstart.py
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify built wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/process-geometry-release-smoke
          /tmp/process-geometry-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/process-geometry-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/process-geometry-release-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import warnings

          import process_geometry as pg
          from process_geometry.analysis.abelian import AbelianPeriodMatrix
          from process_geometry.analysis.am import AMFunctionTheory
          from process_geometry.presentation.constraints import AlgebraicConstraintSet
          from process_geometry.presentation.morphism import PresentationMorphism
          from process_geometry.process.history import ProcessWord

          assert pg.__version__ == version("process-geometry")
          assert ProcessWord is not None
          assert AMFunctionTheory is not None
          assert AlgebraicConstraintSet is not None
          assert PresentationMorphism is not None
          assert AbelianPeriodMatrix is not None

          with warnings.catch_warnings():
              warnings.simplefilter("ignore", DeprecationWarning)
              import aeg_shakespeare as legacy
              from aeg_shakespeare.process.history import ProcessWord as LegacyProcessWord

          assert legacy.process is pg.process
          assert LegacyProcessWord is ProcessWord
          print("wheel smoke OK:", pg.__version__)
          PY

  compatibility-boundaries:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: compatibility-fast (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test supported compatibility surface
        run: python -m pytest -q --ignore=tests/research --durations=10
      - name: Run public quickstarts
        run: |
          python examples/quickstart.py
          python examples/constraint_quickstart.py
          python examples/grammar_quickstart.py

  weekly-full-version-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: weekly-full-suite (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test full suite
        run: python -m pytest -q --durations=25
