name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify built wheel outside source tree
        shell: bash
        run: |
          python -m venv /tmp/aeg-shakespeare-release-smoke
          /tmp/aeg-shakespeare-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/aeg-shakespeare-release-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/aeg-shakespeare-release-smoke/bin/python - <<'PY'
          import aeg_shakespeare as shakespeare
          assert shakespeare.__version__ == "0.0.1"
          assert hasattr(shakespeare, "ProcessWord")
          assert hasattr(shakespeare, "AMFunctionTheory")
          assert hasattr(shakespeare, "AlgebraicConstraintSet")
          print("wheel smoke OK:", shakespeare.__version__)
          PY
