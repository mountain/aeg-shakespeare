name: Sonnet Lonely Runner Upstream Benchmark

# This is a research benchmark, not a routine CI gate.  It intentionally runs
# only when explicitly dispatched so ordinary pushes/PRs do not replay the
# multi-minute pinned-upstream experiment.
on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_SHA: 755b116b2e6090cd4a83187a696f863388b7d746

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          uname -a
          g++ --version
          nproc

      - name: Checkout pinned upstream twice
        run: |
          git clone --quiet https://github.com/vzsky/13-lonely-runners.git upstream-baseline
          git -C upstream-baseline checkout --quiet "$UPSTREAM_SHA"
          test "$(git -C upstream-baseline rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp -a upstream-baseline upstream-patched
          echo "Pinned upstream: $(git -C upstream-baseline rev-parse HEAD)"

      - name: Apply minimal two-slot patch
        run: |
          git -C upstream-patched apply --check "$GITHUB_WORKSPACE/sonnet/lonely-runner/patches/phase5-two-slot-find-cover.patch"
          git -C upstream-patched apply "$GITHUB_WORKSPACE/sonnet/lonely-runner/patches/phase5-two-slot-find-cover.patch"
          git -C upstream-patched diff --check
          git -C upstream-patched diff -- src/find_cover.h

      - name: Compile baseline and patched harnesses
        run: |
          CXXFLAGS='-O3 -std=c++23 -pthread -march=native'
          g++ $CXXFLAGS \
            -I"$GITHUB_WORKSPACE/upstream-baseline/src" \
            sonnet/lonely-runner/cpp/upstream_find_cover_harness.cpp \
            -o /tmp/lr-upstream-baseline
          g++ $CXXFLAGS \
            -I"$GITHUB_WORKSPACE/upstream-patched/src" \
            sonnet/lonely-runner/cpp/upstream_find_cover_harness.cpp \
            -o /tmp/lr-upstream-patched

      - name: Verify complete canonical solution sets K8 to K12
        run: |
          mkdir -p /tmp/lr-solutions
          for p in 79 89 127 131 139; do
            /tmp/lr-upstream-baseline dump "$p" > "/tmp/lr-solutions/base-$p.txt"
            /tmp/lr-upstream-patched dump "$p" > "/tmp/lr-solutions/patched-$p.txt"
            cmp "/tmp/lr-solutions/base-$p.txt" "/tmp/lr-solutions/patched-$p.txt"
            echo "P=$p exact-set SHA256: $(sha256sum "/tmp/lr-solutions/base-$p.txt" | cut -d' ' -f1)"
            head -n 1 "/tmp/lr-solutions/base-$p.txt"
          done
          rm -f /tmp/lr-solutions/base-131.txt /tmp/lr-solutions/patched-131.txt
          rm -f /tmp/lr-solutions/base-139.txt /tmp/lr-solutions/patched-139.txt

      - name: Benchmark pinned upstream source K8 to K10
        run: |
          echo '=== baseline ==='
          for p in 79 89 127; do
            /tmp/lr-upstream-baseline bench "$p" 15 3
          done
          echo '=== patched ==='
          for p in 79 89 127; do
            /tmp/lr-upstream-patched bench "$p" 15 3
          done

      - name: Transfer frozen rule to solved-frontier K11 and K12
        run: |
          python - <<'PY'
          import re
          import subprocess

          cases = [
              (131, 5, 1),
              (139, 3, 1),
          ]
          pattern = re.compile(
              r"P=(\d+) K=(\d+) N=(\d+) repeats=(\d+) warmups=(\d+) "
              r"median_ms=([0-9.]+) mean_ms=([0-9.]+) min_ms=([0-9.]+)"
          )

          for p, repeats, warmups in cases:
              results = {}
              for label, binary in (
                  ("baseline", "/tmp/lr-upstream-baseline"),
                  ("patched", "/tmp/lr-upstream-patched"),
              ):
                  output = subprocess.check_output(
                      [binary, "bench", str(p), str(repeats), str(warmups)],
                      text=True,
                  ).strip()
                  print(label, output)
                  match = pattern.fullmatch(output)
                  assert match, output
                  n = int(match.group(3))
                  median = float(match.group(6))
                  results[label] = (n, median)

              assert results["baseline"][0] == results["patched"][0]
              speedup = results["baseline"][1] / results["patched"][1]
              print(f"P={p} frozen-rule median speedup={speedup:.3f}x")
          PY

      - name: Upload exact-set evidence
        uses: actions/upload-artifact@v4
        with:
          name: lonely-runner-upstream-solution-sets
          path: /tmp/lr-solutions
          retention-days: 30
