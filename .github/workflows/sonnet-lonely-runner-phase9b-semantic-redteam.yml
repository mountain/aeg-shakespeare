name: Sonnet Lonely Runner Phase 9B Semantic Red Team

# Heavy exact semantic red team. Manual-only after the center-3 -> center-4
# calibration; routine CI must not rebuild the persistent constraint cells.
on:
  workflow_dispatch:

jobs:
  phase9b:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run Phase 9B exact executable check
        env:
          AEG_RUN_LR_CENTER4_SEMANTICS: "1"
        run: |
          python -m pytest -q -s tests/research/test_lonely_runner_center4_semantic_redteam.py
