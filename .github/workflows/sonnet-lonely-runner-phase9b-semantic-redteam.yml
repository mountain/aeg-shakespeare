name: Sonnet Lonely Runner Phase 9B Semantic Red Team

# One auditable center4 local semantic red team. Only the nine Phase-9A pressure
# cells are refined by symbolic event-order branching; no full center4 wall
# arrangement is built. The script output is uploaded separately so failures can
# be audited without GitHub setup-log noise.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sonnet-lonely-runner-phase9b-semantic-redteam.yml

jobs:
  phase9b:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 9B exact local semantic red team
        id: probe
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python sonnet/lonely-runner/python/center4_semantic_redteam.py > phase9b.log 2>&1

      - name: Upload Phase 9B script output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9b-output
          path: phase9b.log

      - name: Propagate probe failure
        if: steps.probe.outcome == 'failure'
        run: exit 1
