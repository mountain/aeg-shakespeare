name: Sonnet Lonely Runner Phase 9B Semantic Red Team

# Heavy exact semantic red team. Manual-only after the center-3 -> center-4
# calibration; routine CI must not rebuild the persistent constraint cells.
on:
  workflow_dispatch:

jobs:
  phase9b:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 9B exact local semantic red team
        run: |
          python sonnet/lonely-runner/python/center4_semantic_redteam.py
