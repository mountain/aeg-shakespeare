name: Sonnet Lonely Runner Phase 9A Constraint Cells

# Manual scaling calibration: first replay the generic next-layer detector on
# center2->3, then apply the unchanged rule to the Phase-8E center3 persistent
# constraint-cell representation and the center4 contact layer. Routine CI does
# not repeat the exact closure materialization on every PR synchronization.
on:
  workflow_dispatch:

jobs:
  phase9a:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run Phase 9A exact executable check
        env:
          AEG_RUN_LR_CENTER4_CELLS: "1"
        run: |
          python -m pytest -q -s tests/research/test_lonely_runner_center4_constraint_cells.py
