name: Sonnet Lonely Runner Safe-Window Task Transfer

# Phase 14 keeps the public package untouched.  The exact task-change and
# structural calibrations run once on Python 3.12 instead of being multiplied
# across the routine compatibility matrix.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sonnet/lonely-runner/python/safe_window_task_transfer.py"
      - "sonnet/lonely-runner/python/safe_window_argmin_motif.py"
      - "sonnet/lonely-runner/38-safe-window-task-relative-completion.md"
      - "tests/research/test_lonely_runner_safe_window_task_transfer.py"
      - "tests/research/test_lonely_runner_safe_window_argmin_motif.py"
      - ".github/workflows/sonnet-lonely-runner-safe-window-task.yml"

jobs:
  safe-window-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AEG_RUN_LR_SAFE_WINDOW_TASK: "1"

    steps:
      - name: Checkout Shakespeare
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run exact task-change and argmin calibrations
        run: |
          python -m pytest -q -s \
            tests/research/test_lonely_runner_safe_window_task_transfer.py \
            tests/research/test_lonely_runner_safe_window_argmin_motif.py
