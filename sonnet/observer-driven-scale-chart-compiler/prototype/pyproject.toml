[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-geometry-scale-compiler"
version = "0.1.0"
description = "Research-local prototype for observer-driven scale and chart compilation"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scale_compiler*"]
