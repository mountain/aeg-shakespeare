[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-analytic-germ-workstream"
version = "0.0.0"
description = "Research-local analytic-germ adapter for the frozen scale compiler"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analytic_germ_adapter*"]

